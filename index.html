<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hedgehog | Legal &amp; Support</title>
<meta name="description" content="Hedgehog: Privacy Policy, Terms of Use and Support">
<script>
// Routing: /?doc=privacy|terms|support&lang=en|ru
// Without lang the browser language is used (ru/uk/be/kk -> ru, else en).
// Without doc the page shows the links in the detected language.
(function () {
	var DOCS = {
		"privacy": "privacy-policy", "privacy-policy": "privacy-policy",
		"terms": "terms-of-use", "terms-of-use": "terms-of-use",
		"support": "support"
	};
	var params = new URLSearchParams(location.search);
	var lang = (params.get("lang") || "").toLowerCase();
	if (lang !== "en" && lang !== "ru") {
		var prefs = navigator.languages || [navigator.language || "en"];
		lang = "en";
		for (var i = 0; i < prefs.length; i++) {
			var code = (prefs[i] || "").toLowerCase().slice(0, 2);
			if (code === "ru" || code === "uk" || code === "be" || code === "kk") { lang = "ru"; break; }
			if (code === "en") break;
		}
	}
	var doc = DOCS[(params.get("doc") || "").toLowerCase()];
	if (doc) {
		location.replace(lang + "/" + doc + ".html");
		return;
	}
	document.documentElement.setAttribute("data-lang", lang);
	document.documentElement.lang = lang;
})();
</script>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;subset=latin,cyrillic&amp;display=swap">
<link rel="stylesheet" href="style.css">
<style>
	html[data-lang="ru"] .lang-en, html[data-lang="en"] .lang-ru { display: none; }
</style>
</head>
<body>
<main class="doc index">
<section class="lang-en">
<h1>Hedgehog</h1>
<ul>
<li><a href="en/privacy-policy.html">Privacy Policy</a></li>
<li><a href="en/terms-of-use.html">Terms of Use</a></li>
<li><a href="en/support.html">Support</a></li>
</ul>
<p><a href="?lang=ru" hreflang="ru">Русская версия</a></p>
</section>
<section class="lang-ru" lang="ru">
<h1>Ёжик колючая спинка</h1>
<ul>
<li><a href="ru/privacy-policy.html">Политика конфиденциальности</a></li>
<li><a href="ru/terms-of-use.html">Условия использования</a></li>
<li><a href="ru/support.html">Поддержка</a></li>
</ul>
<p><a href="?lang=en" hreflang="en">English version</a></p>
</section>
</main>
</body>
</html>
